services:
  server:
    image: node:18
    container_name: server
    working_dir: /app
    volumes:
      - ./server:/app
    command: node server.js
    ports:
      - "3000:3000"
    environment:
      - RATE_LIMIT=false  # Set to 'true' to enable rate limiting
      - OVERLOAD_THRESHOLD=500
      - PROCESSING_TIME=5
    networks:
      - botnet

  cnc:
    image: python:3.10
    container_name: cnc
    working_dir: /app
    volumes:
      - ./cnc:/app
      - shared:/shared
    command: python cnc.py
    stdin_open: true
    tty: true
    networks:
      - botnet
  
  #20 bot; 5000 request/bot; 20 luong
  # Bot 1
  bot_1:
    image: python:3.10
    container_name: bot_1
    working_dir: /app
    volumes:
      - ./bot:/app
      - shared:/shared
    command: sh -c "pip install requests -q && python bot.py"
    environment:
      - BOT_ID=Bot_1
      - TARGET=http://server:3000
      - REQUEST_COUNT=5000
      - CONCURRENT_THREADS=20
    depends_on:
      - server
    networks:
      - botnet

  # Bot 2
